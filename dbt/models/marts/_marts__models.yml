version: 2

models:
  - name: fct_indicadores_diarios
    description: >
      Uma linha por dia corrido. Selic meta e dólar (com o último valor conhecido
      em fins de semana e feriados), variação diária e média móvel de 21 dias úteis.
    columns:
      - name: data
        data_tests: [unique, not_null]
      - name: dia_util
        description: Verdadeiro quando houve cotação de dólar no dia.
      - name: selic_meta_aa
        description: Meta da Selic definida pelo Copom (% ao ano).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50
      - name: dolar_venda
        description: Dólar americano, taxa de venda (R$).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 20
      - name: dolar_variacao_diaria_pct
        description: Variação % contra o dia útil anterior. Nula em dias sem cotação.
      - name: dolar_media_movel_21du
        description: Média móvel do dólar nos últimos 21 dias úteis (~1 mês).

  - name: fct_inflacao_juro_real_mensal
    description: >
      Uma linha por mês. IPCA mensal, acumulado no ano e em 12 meses,
      Selic média do mês e juro real ex-post.
    columns:
      - name: mes
        data_tests: [unique, not_null]
      - name: ipca_mensal_pct
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -5
                max_value: 10
      - name: ipca_acumulado_ano_pct
      - name: ipca_12m_pct
        description: Acumulado composto dos últimos 12 meses. Nulo enquanto a janela não estiver completa.
      - name: selic_meta_media_aa
        description: Média diária da meta Selic no mês (% a.a.).
      - name: juro_real_ex_post_aa
        description: (1 + Selic média) / (1 + IPCA 12m) - 1, em % a.a.
