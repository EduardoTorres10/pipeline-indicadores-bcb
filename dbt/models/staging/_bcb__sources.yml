version: 2

sources:
  - name: bcb
    description: Dados brutos do SGS do Banco Central, carregados pela task de ingestão do Airflow.
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_DATASET_RAW', 'raw_bcb') }}"
    tables:
      - name: series_sgs
        description: Uma linha por série e data, exatamente como retornado pela API (texto).
        config:
          loaded_at_field: _carregado_em
          freshness:
            warn_after: { count: 3, period: day }
            error_after: { count: 7, period: day }
        columns:
          - name: codigo_serie
            description: Código da série no SGS (432, 433, 1).
            data_tests:
              - not_null
          - name: nome_serie
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["selic_meta", "ipca_mensal", "dolar_venda"]
